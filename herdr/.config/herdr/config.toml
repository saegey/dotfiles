onboarding = false

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[ui]
status_indicators = "symbols"
sidebar_collapsed_mode = "hidden"
sidebar_max_width = 44
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
tab_bar_right = [
  { type = "command", command = "~/.local/bin/herdr-music --cached-status", interval_seconds = 1, timeout_seconds = 1 },
]

[ui.sidebar.spaces]
rows = [["state_icon", { token = "$review", fg = "#f9e2af", bold = true }, "workspace", "$dev_stack", "git_status"], ["$linear_title"]]

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Direct (no-prefix) chords, matching Ghostty/Safari-style muscle memory.
# Requires Ghostty to stop intercepting cmd+t/cmd+1..9 itself first
# (see ~/.config/ghostty/config).
new_tab = "cmd+t"
split_vertical = "cmd+d"
split_horizontal = "cmd+shift+d"
focus_pane_left = ["cmd+alt+left", "prefix+h"]
focus_pane_down = ["cmd+alt+down", "prefix+j"]
focus_pane_up = ["cmd+alt+up", "prefix+k"]
focus_pane_right = ["cmd+alt+right", "prefix+l"]
switch_tab = "cmd+1..9"
toggle_sidebar = ["prefix+b", "cmd+["]

# Ctrl+Option navigates Herdr without conflicting with Dinky's Option shortcuts.
switch_workspace = "ctrl+alt+1..9"
next_agent = "ctrl+alt+j"
previous_agent = "ctrl+alt+k"

[[keys.command]]
key = ["cmd+shift+m", "ctrl+alt+shift+m"]
type = "shell"
description = "Open / hide lounge player"
command = "~/.local/bin/herdr-music-dock"

[[keys.command]]
key = ["cmd+alt+m", "ctrl+alt+shift+n"]
type = "shell"
description = "Open / hide lounge player"
command = "~/.local/bin/herdr-music-dock --toggle-visible"

[[keys.command]]
key = "cmd+p"
type = "pane"
description = "Repo tasks"
command = "herdr-repo-tasks"

[[keys.command]]
key = "cmd+shift+r"
type = "plugin_action"
description = "Review dashboard"
command = "dotfiles.review.open"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
description = "Herdr palette"
command = "ramarivera.palette.open"

[[keys.command]]
key = ["cmd+k", "ctrl+alt+shift+k", "prefix+alt+k"]
type = "plugin_action"
description = "Search tabs, agents, workspaces and branches"
command = "herdr-bar.open"

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
description = "Refresh dev stack status"
command = "dotfiles.dev-stacks.refresh"

[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
description = "Refresh Linear ticket titles"
command = "dotfiles.linear-titles.refresh"

[[keys.command]]
key = "cmd+i"
type = "plugin_action"
description = "Worktree ticket, PR, Actions and app links"
command = "dotfiles.worktree-visor.open"
