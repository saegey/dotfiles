onboarding = false

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = true

[ui]
status_indicators = "symbols"
sidebar_collapsed_mode = "hidden"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "$dev_stack", "git_status"], ["$linear_title"]]

[theme]
name = "catppuccin"
auto_switch = false

[keys]
# Direct (no-prefix) chords, matching Ghostty/Safari-style muscle memory.
# Requires Ghostty to stop intercepting cmd+t/cmd+1..9 itself first
# (see ~/.config/ghostty/config).
new_tab = "cmd+t"
switch_tab = "cmd+1..9"
toggle_sidebar = ["prefix+b", "cmd+["]

# Ctrl+Option navigates Herdr without conflicting with Dinky's Option shortcuts.
switch_workspace = "ctrl+alt+1..9"
next_agent = "ctrl+alt+j"
previous_agent = "ctrl+alt+k"

[[keys.command]]
key = "prefix+alt+p"
type = "pane"
description = "Repo tasks"
command = "herdr-repo-tasks"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
description = "Herdr palette"
command = "ramarivera.palette.open"

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
description = "Refresh dev stack status"
command = "dotfiles.dev-stacks.refresh"

[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
description = "Refresh Linear ticket titles"
command = "dotfiles.linear-titles.refresh"

[[keys.command]]
key = "cmd+i"
type = "plugin_action"
description = "Worktree ticket, PR, Actions and app links"
command = "dotfiles.worktree-visor.open"
