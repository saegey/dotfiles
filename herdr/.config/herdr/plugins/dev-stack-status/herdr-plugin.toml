id = "dotfiles.dev-stacks"
name = "Dev stack status"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Read-only per-worktree Compose status; never starts or stops containers"
platforms = ["macos", "linux"]

[[startup]]
command = ["bash", "refresh.sh"]

[[actions]]
id = "refresh"
title = "Refresh dev stack status"
contexts = ["workspace", "global"]
command = ["bash", "refresh.sh"]

[[events]]
on = "workspace.focused"
command = ["bash", "refresh.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "refresh.sh"]

[[events]]
on = "worktree.created"
command = ["bash", "refresh.sh"]

[[events]]
on = "worktree.opened"
command = ["bash", "refresh.sh"]
