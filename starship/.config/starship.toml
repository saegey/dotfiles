"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username$hostname$directory$git_branch$git_status$aws${env_var.AWS_CONFIG_FILE}$cmd_duration
$character"""

add_newline = false
command_timeout = 2000
scan_timeout = 100

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'

[directory]
style = 'bold cyan'
truncation_length = 3
truncate_to_repo = true
home_symbol = '~'

[username]
show_always = false
style_user = 'bold blue'
style_root = 'bold red'
format = '[$user]($style)'

[hostname]
ssh_only = true
style = 'bold blue'
format = '[@$hostname]($style) '

[git_branch]
style = 'bold purple'
symbol = '⎇ '
format = '[$symbol$branch]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold red'
conflicted = '≠'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '\$'
modified = '!${count}'
staged = '+${count}'
deleted = '✘${count}'

[cmd_duration]
min_time = 2_000
format = 'took [$duration](bold yellow) '

# AWS_PROFILE (shown only when set, e.g. by a repo's mise.toml). Terraform
# blocks with an explicit profile ignore it; `awho` asks AWS directly.
[aws]
format = '[$symbol$profile]($style) '
symbol = '☁ '
style = 'bold yellow'

[aws.profile_aliases]
infra-root-administrator = 'ROOT-ADMIN'
infra-dev-administrator = 'dev-admin'

# A non-default AWS config is active (e.g. a test config that remaps profile
# names), so profile names may not mean what they usually do.
[env_var.AWS_CONFIG_FILE]
format = '[⚠ AWS_CONFIG_FILE ]($style)'
style = 'bold red'

[package]
disabled = true
