#:schema https://dinky.rodeo/schemas/dinky.json
# Trial setup: launch manually; AeroSpace remains available as a fallback.
start-at-login = false
workspaces = 9
default-layout = 'tiles'

[gaps]
inner = 20
# Leave room for the floating SketchyBar and a gap below it.
outer = { top = 56, bottom = 10, left = 10, right = 10 }

[hooks]
startup = ['exec-and-forget sketchybar --trigger dinky_workspace_change >/dev/null 2>&1']
workspace-changed = ['exec-and-forget sketchybar --trigger dinky_workspace_change >/dev/null 2>&1']
focus-changed = ['exec-and-forget sketchybar --trigger dinky_focus_change >/dev/null 2>&1']
display-changed = ['exec-and-forget sketchybar --trigger dinky_workspace_change >/dev/null 2>&1']

[borders]
enabled = true
width = 5
active-color = '#cba6f7'
inactive-color = '#45475a'

[[rules]]
app-id = 'com.mitchellh.ghostty'
run = 'layout tiling'

[[rules]]
app-id = 'com.apple.systempreferences'
run = 'layout floating'

# Tuna's transient launcher windows should never reserve a tile.
[[rules]]
app-id = 'com.brnbw.Tuna'
run = 'layout floating'

[mode.main]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-v = 'join-with right'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-keypad-1 = 'workspace 1'
alt-keypad-2 = 'workspace 2'
alt-keypad-3 = 'workspace 3'
alt-keypad-4 = 'workspace 4'
alt-keypad-5 = 'workspace 5'
alt-keypad-6 = 'workspace 6'
alt-keypad-7 = 'workspace 7'
alt-keypad-8 = 'workspace 8'
alt-keypad-9 = 'workspace 9'

alt-shift-1 = 'move-window-to-workspace 1'
alt-shift-2 = 'move-window-to-workspace 2'
alt-shift-3 = 'move-window-to-workspace 3'
alt-shift-4 = 'move-window-to-workspace 4'
alt-shift-5 = 'move-window-to-workspace 5'
alt-shift-6 = 'move-window-to-workspace 6'
alt-shift-7 = 'move-window-to-workspace 7'
alt-shift-8 = 'move-window-to-workspace 8'
alt-shift-9 = 'move-window-to-workspace 9'
alt-shift-keypad-1 = 'move-window-to-workspace 1'
alt-shift-keypad-2 = 'move-window-to-workspace 2'
alt-shift-keypad-3 = 'move-window-to-workspace 3'
alt-shift-keypad-4 = 'move-window-to-workspace 4'
alt-shift-keypad-5 = 'move-window-to-workspace 5'
alt-shift-keypad-6 = 'move-window-to-workspace 6'
alt-shift-keypad-7 = 'move-window-to-workspace 7'
alt-shift-keypad-8 = 'move-window-to-workspace 8'
alt-shift-keypad-9 = 'move-window-to-workspace 9'

cmd-alt-1 = 'move-window-to-workspace 1 --follow'
cmd-alt-2 = 'move-window-to-workspace 2 --follow'
cmd-alt-3 = 'move-window-to-workspace 3 --follow'
cmd-alt-4 = 'move-window-to-workspace 4 --follow'
cmd-alt-5 = 'move-window-to-workspace 5 --follow'
cmd-alt-6 = 'move-window-to-workspace 6 --follow'
cmd-alt-7 = 'move-window-to-workspace 7 --follow'
cmd-alt-8 = 'move-window-to-workspace 8 --follow'
cmd-alt-9 = 'move-window-to-workspace 9 --follow'
cmd-alt-keypad-1 = 'move-window-to-workspace 1 --follow'
cmd-alt-keypad-2 = 'move-window-to-workspace 2 --follow'
cmd-alt-keypad-3 = 'move-window-to-workspace 3 --follow'
cmd-alt-keypad-4 = 'move-window-to-workspace 4 --follow'
cmd-alt-keypad-5 = 'move-window-to-workspace 5 --follow'
cmd-alt-keypad-6 = 'move-window-to-workspace 6 --follow'
cmd-alt-keypad-7 = 'move-window-to-workspace 7 --follow'
cmd-alt-keypad-8 = 'move-window-to-workspace 8 --follow'
cmd-alt-keypad-9 = 'move-window-to-workspace 9 --follow'

alt-tab = 'workspace-back-and-forth'
alt-slash = 'layout h_tiles v_tiles'
alt-comma = 'layout h_accordion v_accordion'
alt-s = 'workspace-layout dwindle scrolling'
alt-f = 'fullscreen'
cmd-alt-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'
alt-shift-b = 'balance-sizes'
alt-shift-r = 'reload-config'
alt-shift-n = 'move-window-to-display next --follow'
